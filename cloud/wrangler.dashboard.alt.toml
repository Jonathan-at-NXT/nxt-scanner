# ALTER Account 46b4ead7 (vor Umzug 27.10.2026) – nur noch für Lesezugriffe/Aufräumen. Nicht deployen.
# NXT Speicher-Dashboard. Eigener Worker, damit Cloudflare Access nur ihn schützt
# (die Scanner laden weiter ohne Login über nxt-scanner-ingest hoch).
name = "nxt-storage"
main = "src/dashboard.js"
compatibility_date = "2026-07-24"
account_id = "46b4ead777c6a2df24459b42e738f28f"
workers_dev = true

[vars]
# Cloudflare Access (Zero Trust): Team-Domain und Application-AUD nach der Einrichtung eintragen.
# Leer = Dashboard bleibt komplett gesperrt.
ACCESS_TEAM_DOMAIN = "royal-cell-6005.cloudflareaccess.com"
ACCESS_AUD = "402fd8f959b5bda1ce69af0ceedb67228f9f848788fa8d85bbe340e05192f3a6"
ALLOWED_EMAIL_DOMAINS = "nxtstudios.de"

[[d1_databases]]
binding = "DB"
database_name = "nxt-scanner"
database_id = "82c8542a-1a97-481d-a0dd-1b8c4af9d4bd"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true

# Datei-Katalog (EU): für Befunde wie leere Dateien (0 Byte)
[[d1_databases]]
binding = "CATALOG"
database_name = "nxt-catalog"
database_id = "920f10f1-c565-40dc-99b9-f02ce56f00d7"
