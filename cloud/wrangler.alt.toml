# ALTER Account 46b4ead7 (vor Umzug 27.10.2026) – nur noch für Lesezugriffe/Aufräumen. Nicht deployen.
# NXT Scanner Ingest-Worker
# Enthaelt NUR nicht-geheime IDs. Der Ingest-Token ist ein CF-Secret
# (wrangler secret put INGEST_TOKEN) und liegt NIE im Repo.

name = "nxt-scanner-ingest"
main = "src/index.js"
compatibility_date = "2026-07-24"
account_id = "46b4ead777c6a2df24459b42e738f28f"

[vars]
# Nicht geheim: Notion-DB-IDs. Der Notion-Token ist ein CF-Secret (NOTION_TOKEN).
HDD_DB_ID = "31b8ae70-295b-811b-b0c9-daa586563078"
SPEICHERUNGEN_DB_ID = "31b8ae70-295b-814e-88ed-f7caaabfaab6"
SLACK_CHANNEL = "C0C6LSYFL1Z"   # einziger Kanal, in dem der NXT Data Agent liest und antwortet

# Notion-Spiegel aus D1 (ersetzt den Notion-Sync im Scanner)
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nxt-scanner"
database_id = "82c8542a-1a97-481d-a0dd-1b8c4af9d4bd"

# Datei-Katalog (eigene D1, EU-Jurisdiktion): jede Datei je Datenträger, nur Metadaten
[[d1_databases]]
binding = "CATALOG"
database_name = "nxt-catalog"
database_id = "920f10f1-c565-40dc-99b9-f02ce56f00d7"

# Upload-Briefkasten (EU): Zwischenlager bis der Abholer die Datei aufs NAS geschrieben und geprüft hat
[[r2_buckets]]
binding = "BRIEFKASTEN"
bucket_name = "nxt-briefkasten"
jurisdiction = "eu"
