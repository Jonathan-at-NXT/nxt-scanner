<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NXT Speicher</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/uebersicht" aria-label="Übersicht"><span class="brand-nxt">NXT</span><span class="brand-sub">Speicher</span></a>
  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Projekt, Kunde oder Datenträger suchen" autocomplete="off" spellcheck="false">
  </label>
  <div class="status"><span class="rec" aria-hidden="true"></span><span id="stand">lädt …</span></div>
  <div class="me" id="me"></div>
</header>

<div id="questions" class="questions" hidden></div>
<div id="jobs" class="jobs" hidden></div>
<main id="view" tabindex="-1"><div class="loading">Daten werden geladen …</div></main>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-inner">
    <button class="drawer-close" id="drawer-close" aria-label="Schließen">✕</button>
    <div id="drawer-body"></div>
  </div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<nav class="pages" aria-label="Bereiche">
  <a href="#/uebersicht" data-page="uebersicht"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg><span>Übersicht</span></a>
  <a href="#/aufraeumen" data-page="aufraeumen"><svg viewBox="0 0 24 24"><path d="M14 3 9 14"/><path d="M5 14h10l2 7H3Z"/><path d="M7 17v2M11 17v2"/></svg><span>Aufräumen</span></a>
  <a href="#/projekte" data-page="projekte"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 9h18M8 5v4M16 5v4"/></svg><span>Projekte</span></a>
  <a href="#/datentraeger" data-page="datentraeger"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><circle cx="12" cy="13" r="1"/></svg><span>Datenträger</span></a>
  <a href="#/befunde" data-page="befunde"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17v.5"/></svg><span>Befunde</span><b class="badge" id="badge-befunde" hidden></b></a>
  <a href="#/altprojekte" data-page="altprojekte"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4Z"/><path d="M2 4h20v3H2Z"/><path d="M10 11h4"/></svg><span>Altprojekte</span></a>
  <a href="#/zuordnen" data-page="zuordnen"><svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h7M4 17h10"/><path d="m16 10 4 4-4 4"/></svg><span>Zuordnen</span></a>
  <a href="#/upload" data-page="upload"><svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v4h16v-4"/></svg><span>Upload</span></a>
  <a href="#/protokoll" data-page="protokoll"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg><span>Protokoll</span></a>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
